name: Update catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/custom_games.json'
      - 'data/addons.json'
      - 'scripts/sync_catalog.py'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate catalog
        run: python scripts/sync_catalog.py
      - name: Diagnose Nintendo Switch client JSON compatibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('generated/catalog.json')
          root=json.loads(path.read_text(encoding='utf-8'))
          print('ROOT_TYPE:',type(root).__name__)
          if isinstance(root,dict):
              print('ROOT_KEYS:',list(root)[:30])
              for k,v in root.items():
                  if isinstance(v,list):
                      print('ROOT_ARRAY:',k,'COUNT:',len(v))
          elif isinstance(root,list):
              print('ROOT_COUNT:',len(root))
          games = root if isinstance(root,list) else root.get('games',root.get('entries',[]))
          print('SWITCH_READER_VISIBLE_COUNT:',len(games) if isinstance(games,list) else 'invalid')
          for index, game in enumerate(games[:3] if isinstance(games,list) else []):
              print('SAMPLE:',repr({k:game.get(k) for k in ('title','name','title_id','magnet','url')})[:320])
              print('SAMPLE_ARRAY_FIELDS',index,[(k,len(v)) for k,v in game.items() if isinstance(v,list)])
              print('SAMPLE_ALL_KEYS',index,list(game.keys())[:32])
              if index == 0: print('FIRST_TITLES_EXAMPLE',repr(game.get('titles'))[:1200])
          if not isinstance(games,list) or len(games)<1000:
              print('::warning::Public catalog root is incompatible with NRO: expected games, entries or root array')
          PY
      - name: Commit changes only if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/catalog.json generated/addons.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize catalog"
            git push
          fi
