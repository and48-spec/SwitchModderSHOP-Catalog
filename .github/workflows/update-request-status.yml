name: Gestisci richieste Neon
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Codice ticket dal messaggio Telegram (32 caratteri, anche con #)'
        required: true
        type: string
      status:
        description: 'Nuovo stato del ticket'
        required: true
        type: choice
        options:
          - sent
          - in_review
          - approved
          - rejected
      note:
        description: 'Nota facoltativa PUBBLICA (senza dati personali)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: neon-request-statuses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update anonymous status
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          REVIEW_STATUS: ${{ inputs.status }}
          REVIEW_NOTE: ${{ inputs.note }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          from datetime import datetime, timezone

          request_id = os.environ["REQUEST_ID"].strip().lower().lstrip("#")
          status = os.environ["REVIEW_STATUS"].strip()
          note = os.environ.get("REVIEW_NOTE", "").strip()
          if not re.fullmatch(r"[0-9a-f]{32}", request_id):
              raise ValueError("Request code must contain exactly 32 hexadecimal characters")
          if status not in {"sent", "in_review", "approved", "rejected"}:
              raise ValueError("Unsupported status")
          if len(note) > 160 or "\n" in note or "\r" in note:
              raise ValueError("Public note must be a single line of at most 160 characters")
          path = pathlib.Path("requests/statuses.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("version") != 1 or not isinstance(data.get("requests"), dict):
              raise ValueError("Status feed schema invalid")
          data["requests"][request_id] = {
              "status": status,
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "note": note,
          }
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                          encoding="utf-8")
          print(f"Request #{request_id[:8]} now {status}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Ticket #{request_id[:8]} aggiornato\n\n")
              summary.write(f"**Nuovo stato:** `{status}`\n\n")
              summary.write("La Switch interessata leggerà il nuovo stato al prossimo aggiornamento.\n")
          PY
      - name: Publish status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/statuses.json
          if ! git diff --cached --quiet; then
            git commit -m "requests: update review status"
            git pull --rebase origin main
            git push origin main
          fi
